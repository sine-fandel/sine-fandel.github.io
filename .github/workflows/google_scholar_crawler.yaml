name: Sync Google Scholar Data

# Keeps the `google-scholar-stats` data branch in sync with the public Scholar
# profile. The homepage reads that branch at runtime, so publications and
# citation counts update without a Jekyll rebuild.
on:
  page_build:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC every day

permissions:
  contents: write

concurrency:
  group: google-scholar-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install dependencies
        run: pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch Scholar profile
        env:
          # Optional repo secret; falls back to the site owner's public profile id.
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID || 'Y3LoyksAAAAJ' }}
        run: |
          cd google_scholar_crawler
          python main.py

      # If the step above failed (Scholar blocked both strategies), the job
      # stops here and the previously published data branch stays untouched.
      - name: Publish data branch
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          cd google_scholar_crawler/results
          git init -q
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then
            echo "No data changes - skipping publish."
            exit 0
          fi
          git commit -q -m "chore: sync Google Scholar data for ${ACTOR}"
          git push -q --force \
            "https://x-access-token:${TOKEN}@github.com/${REPO}.git" \
            HEAD:google-scholar-stats
